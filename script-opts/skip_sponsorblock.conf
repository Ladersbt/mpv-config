# ─── 服务器地址 ────────────────────────────────────────────────────────────────

# YouTube SponsorBlock API 地址。默认值：https://sponsor.ajay.app/api/skipSegments
youtube_sponsor_server=https://sponsor.ajay.app/api/skipSegments

# Bilibili SponsorBlock API 地址。默认值：https://bsbsb.top/api/skipSegments
bilibili_sponsor_server=https://bsbsb.top/api/skipSegments

# ─── 拉取的片段分类 ────────────────────────────────────────────────────────────
# 向 API 请求的片段类型，多个类别用英文逗号分隔，每项需加引号
# 可选值：
#   "sponsor"        → 赞助商广告（最常见）
#   "selfpromo"      → 自我宣传（博主推广自己的产品/频道）
#   "interaction"    → 引导互动（订阅/点赞提示）
#   "intro"          → 片头（固定开场）
#   "outro"          → 片尾（固定结尾/推荐视频）
#   "preview"        → 剧透预览
#   "music_offtopic" → 音乐视频中的非音乐片段
#   "filler"         → 填充/过渡内容
# 注意：actionType（skip/mute）由服务器返回，不需要在此指定
# 默认值："sponsor"
categories="sponsor","selfpromo","interaction","intro","outro","preview"

# ─── 跳过模式 ──────────────────────────────────────────────────────────────────
# auto   → 自动跳过，检测到片段立即跳（原始行为）
# manual → 手动确认，弹出按钮由用户决定是否跳过
# 默认值：auto
mode=manual

# ─── 手动模式倒计时 ────────────────────────────────────────────────────────────
# manual 模式下，提示按钮显示的秒数，倒计时结束后自动取消（不跳过）
# 设为 0 则按钮永不自动消失，必须手动按 y/n 或点击
# 默认值：10
timeout=15

# ─── 按钮样式设置 ──────────────────────────────────────────────────────────────

# 按钮字体大小。默认值：24
button_font_size=24

# 按钮水平内边距。默认值：20
button_padding_x=20

# 按钮垂直内边距。默认值：15
button_padding_y=15

# 按钮距离屏幕边缘的距离。默认值：60
button_margin=60

# 按钮边框宽度。默认值：2
button_border=2

# 按钮圆角半径。默认值：13
button_radius=13

# ─── 按钮颜色设置（BGR 格式：BBGGRR）──────────────────────────────────────────
# 注意：ASS 颜色格式为 BGR 而非 RGB
# 例：红色 = 0000FF，蓝色 = FF0000，白色 = FFFFFF，黑色 = 000000

# 进度条已完成部分的颜色（普通状态）。默认值：2442F4（橙红色）
button_progress_color=2442F4

# 进度条已完成部分的颜色（悬停状态）。默认值：1830C0（深橙红）
button_progress_hover_color=2442F4

# 进度条未完成部分的颜色（普通状态）。默认值：FFFFFF（白色）
button_remaining_color=FFFFFF

# 进度条未完成部分的颜色（悬停状态）。默认值：111111（深灰色）
button_remaining_hover_color=111111

# 按钮文字颜色（普通状态）。默认值：000000（黑色）
button_text_color=000000

# 按钮文字颜色（悬停状态）。默认值：FFFFFF（白色）
button_text_hover_color=FFFFFF

# 按钮边框颜色。默认值：FFFFFF（白色）
button_border_color=FFFFFF
