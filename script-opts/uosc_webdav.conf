# WebDAV 服务器配置 (用于 uosc 浏览脚本)
# 注意：等号两边不要有空格，URL 必须以斜杠 (/) 结尾

# WebDAV 根目录地址
url=http://127.0.0.1:5244/dav/

# 用户名
user=admin

# 密码
pass=password

# 目录默认排序方式
# 可选值：
#   name_asc  - 按名称升序（A → Z）
#   name_desc - 按名称降序（Z → A）
#   time_desc - 按修改时间降序（最新的在前）
#   time_asc  - 按修改时间升序（最旧的在前）
default_sort=time_desc

# 是否只播放视频
video_only=no