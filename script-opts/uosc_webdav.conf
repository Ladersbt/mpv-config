# WebDAV 服务器配置
# 注意：等号两边不要有空格，URL 必须以斜杠 (/) 结尾

# WebDAV 根目录地址
url=http://127.0.0.1:5244/dav/

# 用户名
user=admin

# 密码
pass=password

# 目录默认排序方式
# 可选值：
#   name_asc  - 按名称升序（A → Z）
#   name_desc - 按名称降序（Z → A）
#   time_desc - 按修改时间降序（最新的在前）
#   time_asc  - 按修改时间升序（最旧的在前）
default_sort=time_desc

# 是否只播放视频
video_only=no

# 是否把菜单里的更改写盘（只接受 yes/no，写错会静默回落默认值）
#   yes = 增删改服务器 / 切换默认服务器 / 切换 video_only 立即写盘（默认）
#   no  = 以上更改仅本次会话生效，重启回到文件里的值
# 可在服务器列表菜单勾选「💾 改动持久化」切换；开关自身的状态始终写盘、
# 不受本门控约束（否则关掉后再也勾不回来——门控自锁）。
persist_changes=yes

# 启动时默认直接进入的服务器（填 servers.json 里某台的 name，精确匹配）
#   留空 = 多服务器时先显示服务器列表菜单；单服务器无论何值都直接进入
default_server=
