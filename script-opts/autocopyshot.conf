########################################
# 临时截图格式设置（用于复制到剪贴板）
########################################

# 临时文件格式: png, jpg, jpeg（GDI+ 不支持 webp；webp 及其他白名单外的值自动回退为 jpg）
# 推荐使用 png（兼容性最好）或 jpg（文件小）
temp_format=jpg

# PNG 压缩等级 (0-9)
# 0=不压缩(最快), 9=最大压缩(最慢), 默认 7
temp_png_compression=8

# PNG 过滤器 (0-5)
# 0=none, 1=sub, 2=up, 3=average, 4=paeth, 5=mixed
# mixed(5) 通常压缩率最好，默认 5
temp_png_filter=5

# JPG 质量 (0-100)
# 数值越高质量越好，文件越大，默认 95
# 仅 100 显著提升（近无损）——需要明确的质量分级时选 100 或改用 png
temp_jpg_quality=95

########################################
# OSD 消息设置
########################################

# OSD 显示时长（秒）
osd_duration=0.8

# 成功复制的提示消息
osd_message_success=✅ 截图已保存并复制到剪贴板

# 复制失败的提示消息
osd_message_fail=❌ 截图已保存但复制失败

# 截图类型提示消息
osd_message_subtitles=同源尺寸-有字幕
osd_message_video=同源尺寸-无字幕
osd_message_window=实际尺寸-有字幕

########################################
# 其他设置
########################################

# 窗口截图额外延迟（秒）
# 窗口截图时先显示 OSD → 等待 osd_duration → 清除 OSD → 等待此偏移 → 截图
# 避免 OSD 提示被截入图片中，默认 0.03
window_screenshot_delay_offset=0.05
