# 注意：
# 1. 颜色代码遵循 ASS 格式，顺序是 BGR (蓝-绿-红)，不是常见的 RGB。例如红色是 0000FF。
# 2. 图标需要安装 Nerd Fonts 字体才能正常显示 (推荐 JetBrainsMono NF)。
# 3. 如果某项不想修改，可以删除该行或在行首加 # 注释掉，脚本将使用默认值。

# === 基础设置 ===

# OSD 显示位置
# 可选值: top-left, top-center, top-right, center-left, center-center, center-right, bottom-left, bottom-center, bottom-right
position=top-right

# === 自动居中设置 ===

# 是否开启第一行视觉居中
# yes: 开启 (尝试让短的第一行相对长的一行居中)
# no: 关闭 (恢复默认的右上角对齐)
auto_center=yes

# 居中修正系数 (默认为 1.0)
# 这是一个微调参数，用来控制“隐形空格”的数量
# 表现为：
# - 如果第一行感觉还是【偏右】(没居中)，把这个值调大 (例如 1.2 或 1.3)
# - 如果第一行感觉跑太远【偏左】了，把这个值调小 (例如 0.8)
# 注意：居中按两行字符串的字节数差估算，中文/emoji/图标等异宽字形与显示宽度不成字节比例，
# 换图标或改文案后该系数通常需要按实际显示重新微调。
center_correction=0.75

# 启动 mpv 时是否默认显示时钟
# yes: 开启, no: 关闭 (可以通过快捷键 script-message-to clock toggle 切换)
enabled_by_default=no

# 时间格式 (遵循 Lua os.date 格式)
# %H: 小时(24制), %M: 分钟, %S: 秒
time_format=%H:%M:%S

# 全局透明度
# 00 (完全不透明) 到 FF (完全透明)
alpha=00

# === 字体设置 ===

# 数字、时间、图标使用的字体 (建议使用等宽且支持 Nerd Fonts 的字体)
font_face_num=CaskaydiaMono NF SemiLight

# 中文提示语使用的字体 (留空则使用 mpv.conf 定义的 osd-font 或系统默认)
# 推荐使用: "Microsoft YaHei" (Windows) 或 "PingFang SC" (macOS)
font_face_text=

# 描边粗细
# 0 表示无描边，推荐 1.5 到 3.0
# 越大的字通常需要越粗的边
border_size=0.6

# 描边透明度当前跟随全局 alpha（无独立选项）：想让描边更淡可整体提高 alpha（如 33）

# === 第一行：当前系统时间设置 ===

# 字号大小（按 720 基准的视频高度缩放：1080p 满屏时实际约 1.5 倍）
size_current=41
# 字体颜色 (纯白: FFFFFF)
color_current=FFFFFF
# 图标 (复制粘贴 Nerd Font 图标)
icon_current=🕒
# 独立描边颜色 (比如你想让主标题的描边重一点)
border_color_current=000000

# === 第二行左侧：还需时长 (Left) ===

# 字号大小 (按 720 基准的视频高度缩放；建议比主标题小，例如 19)
size_left=33
# 字体颜色 (灰白: EEEEEE)
color_left=4657ED
# 图标
icon_left=
# 提示文字 (显示在时间数字前)
text_left=
# 独立描边颜色
border_color_left=000000

# === 第二行右侧：预计结束时间 (End) ===

# 字号大小（按 720 基准的视频高度缩放，同 size_left）
size_end=33
# 字体颜色 (稍暗的灰: DDDDDD)
color_end=FFFFFF
# 图标
icon_end=󱫟
# 提示文字
text_end=
# 独立描边颜色
border_color_end=000000

# === 第二行装饰符号 ===

# 左包裹符
wrapper_open=[
# 右包裹符
wrapper_close=]
# 中间分隔符
separator=|