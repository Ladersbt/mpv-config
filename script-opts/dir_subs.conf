# ----------------------------------------------------
# 1. 状态文件保存路径
# ----------------------------------------------------
state_path=~~/files/dir_subs.json

# ----------------------------------------------------
# 2. 防抖延迟 (秒)
# ----------------------------------------------------
# 当你连续调整字幕大小/位置时，不会立即写入硬盘。
# 只有当你停止操作超过这个时间后，才会保存一次。
# 既保护硬盘，又避免卡顿。
save_delay=0.5

# ----------------------------------------------------
# 3. 调试模式 (yes/no)
# ----------------------------------------------------
# 平时设为 no。如果发现脚本不工作，可以改为 yes，
# 然后按 ` 键查看控制台输出来排查问题。
debug=yes