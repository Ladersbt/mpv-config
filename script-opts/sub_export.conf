# FFmpeg 可执行文件路径
# 如果 ffmpeg 在系统 PATH 中，保持默认值 "ffmpeg" 即可
# Windows 示例: C:/Programs/ffmpeg/bin/ffmpeg.exe
# 注意: Windows 路径使用正斜杠 / 或双反斜杠 \\
ffmpeg_path=ffmpeg

# 界面语言
# eng = 英语
# chs = 中文
language=chs

# ========================================
# SRT 转 ASS 功能
# ========================================

# 是否自动将导出的 SRT 字幕转换为 ASS 格式
# yes = 启用自动转换（推荐，可自定义样式）
# no = 禁用，直接导出 SRT 格式
# 注意: 此选项只影响 SRT 字幕，ASS 和 SUP 字幕不会被转换
convert_srt_to_ass=yes

# ========================================
# ASS 字幕样式设置
# ========================================
# 以下设置仅在 convert_srt_to_ass=yes 时生效

# ------------------
# 字体设置
# ------------------

# 字体名称
# 使用系统已安装的字体名称
# 常用字体: Arial, Times New Roman, Microsoft YaHei, SimHei, 微软雅黑, 黑体
ass_fontname=梦源黑体 SC W20

# 字体大小
# 建议值: 40-60（1080p视频），可根据分辨率调整
# 值越大字体越大
ass_fontsize=20

# ------------------
# 颜色设置
# ------------------
# 颜色格式: &HAABBGGRR
#   AA = 透明度 (00=完全不透明, FF=完全透明)
#   BB = 蓝色分量 (00-FF)
#   GG = 绿色分量 (00-FF)
#   RR = 红色分量 (00-FF)
# 
# 示例:
#   &H00FFFFFF = 白色 (不透明)
#   &H80000000 = 半透明黑色
#   &H000000FF = 红色
#   &H0000FF00 = 绿色
#   &H00FF0000 = 蓝色

# 主要颜色 - 字幕文字的主要颜色
# 默认: &H00FFFFFF (白色)
ass_primary_colour=&H00F0F0F0

# 次要颜色 - 用于卡拉OK效果等特殊场景
# 默认: &H000000FF (红色)
# 大多数情况下不会用到
ass_secondary_colour=&H000000FF

# 边框颜色 - 字幕文字的描边颜色
# 默认: &H00000000 (黑色)
# 黑色描边能让白色字幕在任何背景下都清晰可见
ass_outline_colour=&H00000000

# 背景/阴影颜色 - 字幕的阴影或背景框颜色
# 默认: &H80000000 (半透明黑色)
# 透明度建议 60-C0 之间（&H60000000 到 &HC0000000）
ass_back_colour=&H80000000

# ------------------
# 文字样式
# ------------------

# 粗体
# -1 = 启用粗体
#  0 = 不使用粗体（默认）
ass_bold=0

# 斜体
# -1 = 启用斜体
#  0 = 不使用斜体（默认）
ass_italic=0

# 下划线
# -1 = 启用下划线
#  0 = 不使用下划线（默认）
ass_underline=0

# 删除线
# -1 = 启用删除线
#  0 = 不使用删除线（默认）
ass_strikeout=0

# ------------------
# 缩放和变形
# ------------------

# 水平缩放
# 100 = 正常宽度（默认）
# >100 = 拉宽文字
# <100 = 压窄文字
# 范围: 50-200
ass_scale_x=100

# 垂直缩放
# 100 = 正常高度（默认）
# >100 = 拉高文字
# <100 = 压扁文字
# 范围: 50-200
ass_scale_y=100

# 字符间距
# 0 = 正常间距（默认）
# >0 = 增加间距
# <0 = 减少间距
# 建议范围: -5 到 10
ass_spacing=1

# 旋转角度
# 0 = 不旋转（默认）
# 顺时针旋转的角度，范围 0-360
# 一般保持 0 即可
ass_angle=0

# ------------------
# 边框和阴影
# ------------------

# 边框样式
# 1 = 描边+阴影（默认，推荐）
# 3 = 不透明背景框
# 4 = 仅描边，无阴影
ass_border_style=1

# 边框宽度（描边宽度）
# 0 = 无边框
# 建议值: 1.5-4.0
# 值越大描边越粗，字幕越清晰但也越粗重
# 默认: 2.5
ass_outline=0.4

# 阴影距离
# 0 = 无阴影
# 建议值: 0-3.0
# 值越大阴影偏移越远
# 仅在 border_style=1 时有效
# 默认: 1.5
ass_shadow=0.1

# ------------------
# 对齐和位置
# ------------------

# 对齐方式（按小键盘布局）
# 7 8 9     7=左上  8=中上  9=右上
# 4 5 6     4=左中  5=居中  6=右中
# 1 2 3     1=左下  2=中下  3=右下
# 
# 最常用:
#   2 = 底部居中（默认，最常见）
#   8 = 顶部居中（适合顶部字幕）
#   5 = 屏幕正中（适合特殊场景）
ass_alignment=2

# 左边距（像素）
# 字幕距离屏幕左边缘的最小距离
# 默认: 20
ass_margin_l=20

# 右边距（像素）
# 字幕距离屏幕右边缘的最小距离
# 默认: 20
ass_margin_r=20

# 垂直边距（像素）
# 字幕距离屏幕上/下边缘的距离
# 对于底部字幕(alignment=2)，这是距离底部的距离
# 对于顶部字幕(alignment=8)，这是距离顶部的距离
# 建议值: 10-40
# 默认: 20
ass_margin_v=11

# ------------------
# 其他设置
# ------------------

# 字符编码
# 1 = 默认编码（推荐）
# 0 = ANSI
# 一般保持默认值即可
ass_encoding=1