# 1. 保存数据的路径
# 支持 "~~/" (配置目录), "~/" (用户主目录), 或 "C:/Data/" (绝对路径)
save_path=~~/files/speed_manager.json

# 2. OSD 提示显示时长 (秒)
# 默认值: 2
# 作用: 当你按快捷键切换速度时，屏幕上文字显示多久。
osd_duration=1.5

# 3. 是否实时保存 (yes 或 no)
# 默认值: no
# 作用: 
#   no  = 只在关闭 MPV 时保存一次数据（性能好，保护硬盘）。
#   yes = 每次速度变化都立即写入文件（防止 MPV 崩溃时丢失刚才调整的速度）。
save_on_change=no

# 4. 防抖保存延迟 (秒)
# 仅在 save_on_change=yes 时生效，防止短时间内频繁写入硬盘
# 默认值: 0.5
save_delay=0.5